<script>
(function () {
  var qEl = document.getElementById('ft-q');
  var out = document.getElementById('ft-out');
  function current() {
    try { return new URLSearchParams(location.search).get('q') || ''; } catch (e) { return ''; }
  }
  function go(q) {
    qEl.value = q;
    var path = location.pathname + (q ? '?q=' + encodeURIComponent(q) : '');
    history.replaceState(null, '', path);
    if (window.trdFulltext) window.trdFulltext.renderPage(out, q);
  }
  document.getElementById('ft-form').addEventListener('submit', function (e) {
    e.preventDefault();
    go(qEl.value.trim());
  });
  go(current());
})();
</script>
