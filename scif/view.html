<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SCI[F] Document · The Rubber Duck™</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/favicon-32.png">
<style>
html,body{margin:0;background:#0b0805;color:#f3e6c8;font-family:'Courier Prime','Courier New',monospace}
.bk{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;background:#0b0805;border-bottom:2px solid #c9a24a;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.bk a{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;color:#ffe2a0;text-decoration:none;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;border:1px solid #3a2814;border-radius:3px;background:#140e07}
.bk a:active,.bk a:hover{background:#2a1d10;color:#fff}
.bk svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.bk .dl{margin-left:auto;padding:0 12px;font-size:13px}
h1{font-size:15px;margin:12px 14px 4px;color:#ffe2a0;word-break:break-word}
#st{margin:6px 14px;font-size:13px;color:#b9ab8c}
#pages{padding:6px 6px 40px}
#pages canvas{display:block;width:100%;height:auto;margin:0 auto 8px;background:#fff;max-width:1000px}
</style></head><body>
<div class="bk"><a href="/pdfs.html" id="back" aria-label="Back to SCI[F]"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>Back to SCI[F]</a><a class="dl" id="dl" href="#" download>Download</a></div>
<h1 id="t">Document</h1><p id="st">Loading document</p>
<div id="pages"></div>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>
<script>
(function(){
var q=new URLSearchParams(location.search),f=q.get('f')||'',t=q.get('t')||'';
var back=document.getElementById('back');
var backPath=q.get('back')||'';
if(/^\/[A-Za-z0-9._~\/-]+$/.test(backPath)&&backPath.indexOf('..')<0&&backPath.length<180){
  back.href=backPath;
  back.setAttribute('aria-label','Back');
  var label=back.lastChild;
  if(label&&label.nodeType===3) label.nodeValue=' Back';
}
back.addEventListener('click',function(e){
  try{var r=document.referrer&&new URL(document.referrer);
    var same=r&&r.origin===location.origin;
    var okPdf=same&&/\/pdfs(\.html)?$/.test(r.pathname);
    var okBack=same&&backPath&&(r.pathname===backPath||r.pathname.replace(/\/$/,'')===backPath.replace(/\/$/,''));
    if((okPdf||okBack)&&history.length>1){e.preventDefault();history.back();}}catch(err){}
});
var ALLOWED=/^https:\/\/(memes|media)\.therubberduck\.net\/[^?#]+\.pdf$/i;
var url;
if(ALLOWED.test(f)&&f.indexOf('..')<0){url=f;}
else if(/^scif\/pdfs\/[^?#]+\.pdf$/i.test(f)&&f.indexOf('..')<0){
  url='https://memes.therubberduck.net/'+f.split('/').map(function(s){try{return encodeURIComponent(decodeURIComponent(s));}catch(e){return encodeURIComponent(s);}}).join('/');
}else{document.getElementById('st').textContent='Document not found.';return;}document.getElementById('dl').href=url;
document.getElementById('t').textContent=t||f.split('/').pop();document.title=(t||'SCI[F] Document')+' · The Rubber Duck™';
if(!window.pdfjsLib){location.replace(url);return;}
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js';
var host=document.getElementById('pages'),st=document.getElementById('st');
pdfjsLib.getDocument(url).promise.then(function(pdf){
  st.textContent=pdf.numPages+' pages';var n=1,w=Math.min(1000,host.clientWidth||window.innerWidth),dpr=Math.min(2,window.devicePixelRatio||1);
  function next(){if(n>pdf.numPages)return;pdf.getPage(n++).then(function(pg){
    var v=pg.getViewport({scale:1});var s=w/v.width*dpr;var vp=pg.getViewport({scale:s});
    var c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;host.appendChild(c);
    return pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;}).then(function(){setTimeout(next,0)});}
  next();
}).catch(function(){st.innerHTML='Could not render here. <a style="color:#ffe2a0" href="'+url+'">Open the PDF</a>';});
})();
</script>
</body></html>
