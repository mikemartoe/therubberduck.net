name: IndexNow

on:
  push:
    branches: [main]

# The IndexNow key is public by design (it is a file on the site). No secrets are used.
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Submit changed URLs to IndexNow
        run: python3 tools/indexnow.py
